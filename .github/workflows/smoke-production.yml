name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel and verify health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://navegaclaro-codercup-live-2026.vercel.app/api/health"
          for attempt in $(seq 1 18); do
            echo "Attempt $attempt: $URL"
            body="$(curl --fail --silent --show-error --max-time 15 "$URL" || true)"
            if [ -n "$body" ]; then
              echo "$body"
              HEALTH_JSON="$body" python - <<'PY'
import json, os, sys
try:
    data = json.loads(os.environ['HEALTH_JSON'])
except Exception:
    sys.exit(2)
if data.get('ok') is True and data.get('aiConfigured') is True and data.get('provider') == 'groq':
    print('Production health OK: Groq configured')
    sys.exit(0)
sys.exit(3)
PY
              rc=$?
              if [ "$rc" -eq 0 ]; then exit 0; fi
            fi
            sleep 10
          done
          echo "Production did not become healthy with Groq enabled in time." >&2
          exit 1
