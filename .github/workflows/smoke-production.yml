name: Production smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel and verify health
        shell: bash
        run: |
          set -u
          URL="https://navegaclaro-codercup-live-2026.vercel.app/api/health"
          for attempt in $(seq 1 18); do
            echo "Attempt $attempt: $URL"
            body="$(curl --fail --silent --show-error --max-time 15 "$URL" || true)"
            if [ -n "$body" ]; then
              echo "$body"
              if HEALTH_JSON="$body" python -c "import json,os,sys; d=json.loads(os.environ['HEALTH_JSON']); sys.exit(0 if d.get('ok') is True and d.get('aiConfigured') is True and d.get('provider') == 'groq' else 1)"; then
                echo "Production health OK: Groq configured"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "Production did not become healthy with Groq enabled in time." >&2
          exit 1
